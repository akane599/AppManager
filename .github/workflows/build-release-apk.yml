name: Build release APK
run-name: Build release APK from ${{ inputs.source_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source branch, tag or commit (blank = selected workflow branch)'
        required: false
        type: string
        default: ''
  # Exercise the build when this workflow changes, including its initial addition.
  push:
    branches: ['**']
    paths:
      - '.github/workflows/build-release-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installable release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      # Apply signing only in CI, including when building older source branches.
      - name: Configure installable non-debug release
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-signing.gradle" <<'EOF'
          gradle.beforeProject { project ->
              project.afterEvaluate {
                  if (project.path == ':app') {
                      def android = project.extensions.getByName('android')
                      android.buildTypes.getByName('release').with {
                          signingConfig = android.signingConfigs.getByName('debug')
                          debuggable = false
                      }
                  }
              }
          }
          EOF

      - name: Build release APK
        run: bash ./gradlew --no-daemon --stacktrace --init-script "$RUNNER_TEMP/release-signing.gradle" :app:assembleRelease

      - name: Collect APKs and checksums
        id: apk
        shell: bash
        run: |
          APK_COMMIT="$(git rev-parse --short=12 HEAD)"
          echo "commit=$APK_COMMIT" >> "$GITHUB_OUTPUT"
          mkdir -p apk-artifacts
          shopt -s nullglob
          APK_FILES=(app/build/outputs/apk/release/*.apk)
          if (( ${#APK_FILES[@]} == 0 )); then
            echo '::error::The build produced no release APKs.'
            exit 1
          fi
          APK_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in "${APK_FILES[@]}"; do
            "$APK_TOOLS/apksigner" verify "$apk"
            APK_BADGING="$("$APK_TOOLS/aapt" dump badging "$apk")"
            if grep -q '^application-debuggable' <<< "$APK_BADGING"; then
              echo '::error::The release APK is debuggable.'
              exit 1
            fi
            cp "$apk" "apk-artifacts/AppManager-${APK_COMMIT}-$(basename "$apk")"
          done
          cd apk-artifacts
          sha256sum -- *.apk > SHA256SUMS.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: AppManager-release-${{ steps.apk.outputs.commit }}
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add download instructions
        env:
          APK_COMMIT: ${{ steps.apk.outputs.commit }}
          APK_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Built commit \`$APK_COMMIT\`.

          [Download APKs and SHA-256 checksums]($APK_ARTIFACT_URL), then extract the ZIP and install the APK.

          This is a **non-debug release** build with the regular **App Manager** name and package ID. It uses the repository's development signing key; no signing secrets are required. It cannot update an official installation signed with a different key. Back up your data before replacing an existing installation. Artifacts are retained for 30 days.
          EOF
